# Project V v2: generated 2026-10-26 by tools/make_clash_config.py. Re-run to refresh countries.
# Pick a country in the 'Country' group; each country group auto-uses its fastest server.
mixed-port: 7897
allow-lan: false
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter: ['*.lan', '+.local', '+.msftconnecttest.com', '+.msftncsi.com']
  default-nameserver: [1.1.1.1, 8.8.8.8]
  nameserver: ['https://1.1.1.1/dns-query', 'https://dns.google/dns-query']
  proxy-server-nameserver: ['https://1.1.1.1/dns-query', 'https://dns.google/dns-query']

proxy-providers:
  # Country labels in these names were right >= 89% of the time.
  Rooster:
    type: http
    url: "https://raw.githubusercontent.com/roosterkid/openproxylist/main/V2RAY_RAW.txt"
    path: ./providers/rooster.txt
    interval: 14400
    exclude-filter: "(?i)profile-|subscription-|support-url|expire|traffic|criterion|median|LATEST-UPDATE"
  Mahdi0024:
    type: http
    url: "https://raw.githubusercontent.com/Mahdi0024/ProxyCollector/master/sub/proxies.txt"
    path: ./providers/mahdi0024.txt
    interval: 14400
    exclude-filter: "(?i)profile-|subscription-|support-url|expire|traffic|criterion|median|LATEST-UPDATE"
  Snakem982:
    type: http
    url: "https://raw.githubusercontent.com/snakem982/proxypool/main/source/v2ray-2.txt"
    path: ./providers/snakem982.txt
    interval: 14400
    exclude-filter: "(?i)profile-|subscription-|support-url|expire|traffic|criterion|median|LATEST-UPDATE"
  PuddinCat:
    type: http
    url: "https://raw.githubusercontent.com/PuddinCat/BestClash/main/proxies.yaml"
    path: ./providers/puddincat.txt
    interval: 14400
    exclude-filter: "(?i)profile-|subscription-|support-url|expire|traffic|criterion|median|LATEST-UPDATE"
  # Fast, but 30-50% of country labels are wrong. Also the 'Fastest anywhere' pool.
  Radikal-fast:
    type: http
    url: "https://raw.githubusercontent.com/0xRadikal/Free-v2ray-Configs/main/fast/configs.txt"
    path: ./providers/radikal-fast.txt
    interval: 14400
    exclude-filter: "(?i)profile-|subscription-|support-url|expire|traffic|criterion|median|LATEST-UPDATE"
  F0rc3Run:
    type: http
    url: "https://raw.githubusercontent.com/F0rc3Run/F0rc3Run/main/Best-Results/clash.yaml"
    path: ./providers/f0rc3run.txt
    interval: 14400
    exclude-filter: "(?i)profile-|subscription-|support-url|expire|traffic|criterion|median|LATEST-UPDATE"
  Mahdibland:
    type: http
    url: "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/Eternity.txt"
    path: ./providers/mahdibland.txt
    interval: 14400
    exclude-filter: "(?i)profile-|subscription-|support-url|expire|traffic|criterion|median|LATEST-UPDATE"
  AwesomeVPN:
    type: http
    url: "https://raw.githubusercontent.com/awesome-vpn/awesome-vpn/master/all"
    path: ./providers/awesomevpn.txt
    interval: 14400
    exclude-filter: "(?i)profile-|subscription-|support-url|expire|traffic|criterion|median|LATEST-UPDATE"
  # Au1rxx exit-verified servers; the prefix lets the country filter match them.
  Au1rxx-AE:
